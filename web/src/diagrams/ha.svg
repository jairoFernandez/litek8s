<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ha-title ha-desc" class="d d-ha">
  <title id="ha-title">HA control plane</title>
  <desc id="ha-desc">kubectl on your laptop talks to litek8s lb on 127.0.0.1:6443, which forwards to a control plane of three servers that replicate the object store with Raft on port 6444. Nodes connect to any server and fail over to another.</desc>
  <defs>
    <marker id="ha-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 9 5 0 9z" class="d-head"/></marker>
  </defs>
  <rect class="d-pill" x="270" y="12" width="220" height="46" rx="23"/>
  <text class="d-t" x="380" y="41" text-anchor="middle">your laptop · kubectl</text>
  <path class="d-edge" d="M380 58V94" marker-end="url(#ha-arrow)"/>
  <rect class="d-box d-box-accent" x="270" y="96" width="220" height="58" rx="12"/>
  <text class="d-t" x="380" y="121" text-anchor="middle">litek8s lb</text>
  <text class="d-l d-l-muted" x="380" y="141" text-anchor="middle">127.0.0.1:6443</text>
  <path class="d-edge" d="M330 154C330 190 136 186 136 222M380 154V222M430 154C430 190 624 186 624 222" marker-end="url(#ha-arrow)"/>
  <path class="d-comet" pathLength="100" d="M380 58V96M380 154V222"/>
  <rect class="d-frame d-frame-accent" x="24" y="190" width="712" height="120" rx="16"/>
  <text class="d-fl" x="40" y="212">control plane</text>
  <rect class="d-box" x="56" y="224" width="160" height="62" rx="12"/>
  <text class="d-t" x="136" y="251" text-anchor="middle">server 1</text>
  <text class="d-s" x="136" y="271" text-anchor="middle">API + store</text>
  <rect class="d-box d-box-leader" x="300" y="224" width="160" height="62" rx="12"/>
  <rect class="d-leader-ring" x="300" y="224" width="160" height="62" rx="12"/>
  <text class="d-t" x="380" y="251" text-anchor="middle">server 2</text>
  <text class="d-s d-s-accent" x="380" y="271" text-anchor="middle">Raft leader</text>
  <rect class="d-box" x="544" y="224" width="160" height="62" rx="12"/>
  <text class="d-t" x="624" y="251" text-anchor="middle">server 3</text>
  <text class="d-s" x="624" y="271" text-anchor="middle">API + store</text>
  <path class="d-edge" d="M216 255H300M460 255H544"/>
  <text class="d-l" x="258" y="246" text-anchor="middle">Raft</text>
  <text class="d-l d-l-muted" x="258" y="274" text-anchor="middle">:6444</text>
  <text class="d-l" x="502" y="246" text-anchor="middle">Raft</text>
  <text class="d-l d-l-muted" x="502" y="274" text-anchor="middle">:6444</text>
  <path class="d-comet d-comet-fast" pathLength="100" d="M300 255H216"/>
  <path class="d-comet d-comet-fast" pathLength="100" d="M460 255H544"/>
  <!-- nodes -->
  <path class="d-edge d-edge-dashed" d="M160 382V310M380 382V310M600 382V310" marker-end="url(#ha-arrow)"/>
  <text class="d-l" x="612" y="352">any server, fail over</text>
  <rect class="d-frame" x="24" y="356" width="712" height="104" rx="16"/>
  <text class="d-fl" x="40" y="448">nodes</text>
  <rect class="d-box" x="80" y="384" width="160" height="48" rx="10"/>
  <circle class="d-ready" cx="104" cy="408" r="5"/>
  <text class="d-t" x="118" y="413">agent</text>
  <rect class="d-box" x="300" y="384" width="160" height="48" rx="10"/>
  <circle class="d-ready" cx="324" cy="408" r="5"/>
  <text class="d-t" x="338" y="413">agent</text>
  <rect class="d-box" x="520" y="384" width="160" height="48" rx="10"/>
  <circle class="d-ready" cx="544" cy="408" r="5"/>
  <text class="d-t" x="558" y="413">agent</text>
</svg>
