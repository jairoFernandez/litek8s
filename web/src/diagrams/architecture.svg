<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc" class="d d-arch">
  <title id="arch-title">How litek8s works</title>
  <desc id="arch-desc">kubectl, Helm, Argo CD, litek8s ui and MCP agents talk to the Kubernetes API server on port 6443; docker, compose, Dev Containers and Testcontainers talk to the Docker Engine API on docker.sock. Both live in one litek8s process with the object store (a WAL, or Raft in HA), the controllers and scheduler, DNS and the service proxy, metrics, logs and alerts, and the node agent. The node agent and the Docker API run containers on crun, with no containerd and no pause containers.</desc>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 9 5 0 9z" class="d-head"/></marker>
  </defs>
  <!-- clients -->
  <rect class="d-pill" x="24" y="14" width="380" height="56" rx="28"/>
  <text class="d-t" x="214" y="38" text-anchor="middle">kubectl · Helm · Argo CD</text>
  <text class="d-s" x="214" y="57" text-anchor="middle">litek8s ui · MCP agents</text>
  <rect class="d-pill" x="420" y="14" width="316" height="56" rx="28"/>
  <text class="d-t" x="578" y="38" text-anchor="middle">docker · compose</text>
  <text class="d-s" x="578" y="57" text-anchor="middle">Dev Containers · Testcontainers</text>
  <path class="d-edge" d="M214 70V150" marker-end="url(#arch-arrow)"/>
  <path class="d-comet" pathLength="100" d="M214 70V150"/>
  <text class="d-l" x="224" y="116">:6443</text>
  <path class="d-edge" d="M560 70V150" marker-end="url(#arch-arrow)"/>
  <path class="d-comet" pathLength="100" d="M560 70V150" style="--delay:-1.1s"/>
  <text class="d-l" x="570" y="116">docker.sock</text>
  <!-- the process -->
  <rect class="d-frame d-frame-accent" x="12" y="96" width="736" height="338" rx="18"/>
  <text class="d-fl" x="32" y="90">litek8s · one process</text>
  <rect class="d-box d-box-accent" x="36" y="150" width="356" height="72" rx="12"/>
  <text class="d-t" x="214" y="181" text-anchor="middle">Kubernetes API server</text>
  <text class="d-s" x="214" y="203" text-anchor="middle">CRDs + CEL · server-side apply · watch</text>
  <rect class="d-box d-box-accent" x="420" y="150" width="280" height="72" rx="12"/>
  <text class="d-t" x="560" y="181" text-anchor="middle">Docker Engine API</text>
  <text class="d-s" x="560" y="203" text-anchor="middle">containers · networks · images · build</text>
  <!-- the bus between the API server and the rest -->
  <path class="d-edge" d="M214 222V256M99 256H651M99 256V290M237 256V290M375 256V290M513 256V290M651 256V290"/>
  <path class="d-comet" pathLength="100" d="M214 222V256H651V290"/>
  <path class="d-comet" pathLength="100" d="M214 222V256H99V290" style="--delay:-0.8s"/>
  <path class="d-comet" pathLength="100" d="M513 290V256H214V222" style="--delay:-1.6s"/>
  <path class="d-store" d="M36 302c0-8 28-12 63-12s63 4 63 12v48c0 8-28 12-63 12s-63-4-63-12z"/>
  <path class="d-store-lid" d="M36 302c0 8 28 12 63 12s63-4 63-12"/>
  <text class="d-t" x="99" y="334" text-anchor="middle">object store</text>
  <text class="d-s" x="99" y="352" text-anchor="middle">WAL, or Raft in HA</text>
  <rect class="d-box" x="174" y="290" width="126" height="72" rx="12"/>
  <text class="d-t" x="237" y="321" text-anchor="middle">controllers</text>
  <text class="d-s" x="237" y="341" text-anchor="middle">+ scheduler</text>
  <rect class="d-box" x="312" y="290" width="126" height="72" rx="12"/>
  <text class="d-t" x="375" y="321" text-anchor="middle">DNS</text>
  <text class="d-s" x="375" y="341" text-anchor="middle">+ service proxy</text>
  <rect class="d-box" x="450" y="290" width="126" height="72" rx="12"/>
  <text class="d-t" x="513" y="321" text-anchor="middle">metrics · logs</text>
  <text class="d-s" x="513" y="341" text-anchor="middle">alerts</text>
  <rect class="d-box" x="588" y="290" width="126" height="72" rx="12"/>
  <text class="d-t" x="651" y="321" text-anchor="middle">node agent</text>
  <text class="d-s" x="651" y="341" text-anchor="middle">pods · logs · exec</text>
  <!-- to crun -->
  <path class="d-edge" d="M651 362V468" marker-end="url(#arch-arrow)"/>
  <path class="d-comet" pathLength="100" d="M651 362V468" style="--delay:-0.4s"/>
  <text class="d-l" x="661" y="456">pods</text>
  <path class="d-edge" d="M700 186H731V497H717" marker-end="url(#arch-arrow)"/>
  <path class="d-comet" pathLength="100" d="M700 186H731V497H717" style="--delay:-1.4s"/>
  <rect class="d-box d-box-ok" x="300" y="470" width="416" height="56" rx="12"/>
  <text class="d-t" x="508" y="494" text-anchor="middle">crun: containers</text>
  <text class="d-s" x="508" y="513" text-anchor="middle">no containerd, no pause containers</text>
  <text class="d-note" x="24" y="494">one Rust process</text>
  <text class="d-note d-note-muted" x="24" y="513">idles at about 20 MiB</text>
</svg>
