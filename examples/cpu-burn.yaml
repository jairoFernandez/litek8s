apiVersion: litek8s.dev/v1alpha1
kind: Deployment
metadata:
  name: cpu-burn
spec:
  replicas: 1
  template:
    spec:
      restartPolicy: Always
      containers:
        - name: burner
          image: alpine:3.20
          command: ["sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i + 1))
                if [ "$i" -gt 2000000 ]; then
                  i=0
                fi
              done
          resources:
            limits:
              cpu: "750m"
              memory: "32Mi"
