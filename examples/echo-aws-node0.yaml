apiVersion: litek8s.dev/v1alpha1
kind: Deployment
metadata:
  name: echo-aws
  labels:
    app: echo-aws
spec:
  replicas: 1
  template:
    spec:
      nodeName: litek8s-node-0
      restartPolicy: Always
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args:
            - "-listen"
            - ":5678"
            - "-text"
            - "hello from litek8s-node-0 (AWS EC2)"
          resources:
            limits:
              cpu: "100m"
              memory: "32Mi"
          ports:
            - containerPort: 5678
              hostPort: 8091
