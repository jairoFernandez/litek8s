apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlantis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '50'
spec:
  project: default
  source:
    repoURL: https://runatlantis.github.io/helm-charts
    chart: atlantis
    targetRevision: 6.16.1
    helm:
      valuesObject:
        atlantisUrl: https://atlantis.<DOMAIN_NAME><INGRESS_HTTPS_SUFFIX>
        # Only the Gitea below can reach it, with the webhook secret.
        orgAllowlist: "*"
        hidePrevPlanComments: true
        gitea:
          user: atlantis
          baseUrl: http://gitea-http.gitea.svc.cluster.local:3000
        # gitea_token, gitea_secret and VAULT_TOKEN, from OpenBao (below).
        vcsSecretName: atlantis-secrets
        loadEnvFromSecrets:
          - atlantis-secrets
        environment:
          VAULT_ADDR: http://openbao.openbao.svc.cluster.local:8200
        defaultTFDistribution: opentofu
        # OpenTofu state in Secrets of this namespace.
        enableKubernetesBackend: true
        statefulSet:
          annotations:
            secret.reloader.stakater.com/reload: atlantis-secrets
        repoConfig: |
          repos:
            - id: /.*/
              allowed_overrides: [workflow]
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: platform-ca
          host: atlantis.<DOMAIN_NAME>
          path: /
          pathType: Prefix
          tls:
            - secretName: atlantis-tls
              hosts:
                - atlantis.<DOMAIN_NAME>
        extraManifests:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: atlantis-secrets
              namespace: atlantis
            spec:
              refreshInterval: 1m
              secretStoreRef:
                kind: ClusterSecretStore
                name: openbao-platform
              target:
                name: atlantis-secrets
              dataFrom:
                - extract:
                    key: atlantis
  destination:
    name: in-cluster
    namespace: atlantis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 5m0s
        factor: 2
