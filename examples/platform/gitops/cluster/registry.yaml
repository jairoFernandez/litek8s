# The app of apps: every Application in this directory, this one included.
# up.sh applies it once; after that it follows the repository. No finalizer:
# deleting it does not take the platform down with it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: default
  source:
    repoURL: <GITOPS_REPO_URL>
    path: registry/clusters/<CLUSTER_NAME>
    targetRevision: HEAD
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Every Application here retries without end (limit -1): Argo CD's
    # automated sync never tries a revision again once its retries are used
    # up, so an Application that failed early (CRDs of an earlier wave not
    # there yet, the API server briefly unreachable) would stay OutOfSync until
    # the next commit, and this sync would wait on it with every later wave.
    retry:
      limit: -1
      backoff:
        duration: 5s
        maxDuration: 5m0s
        factor: 2
