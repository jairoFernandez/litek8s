# The sample app's development environment (registry/environments/development).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: development
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '70'
spec:
  project: default
  source:
    repoURL: <GITOPS_REPO_URL>
    path: registry/environments/development/metaphor
    targetRevision: HEAD
  destination:
    name: in-cluster
    namespace: development
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 5m0s
        factor: 2
