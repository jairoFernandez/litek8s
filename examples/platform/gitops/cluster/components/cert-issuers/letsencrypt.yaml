# Let's Encrypt, for a DOMAIN that resolves publicly to this cluster (e.g.
# <public IP>.sslip.io) with the ingress on port 80: HTTP-01 through Traefik.
# Browsers trust these certificates with no CA to install. up.sh keeps this
# file only with ISSUER=letsencrypt; the platform CA above stays either way.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: <ACME_SERVER>
    email: <ACME_EMAIL>
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
