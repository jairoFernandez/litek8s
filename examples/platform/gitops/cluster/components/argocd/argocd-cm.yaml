apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # An Application is healthy when what it deploys is: the app of apps then
  # waits for each sync wave's Applications before the next wave (Argo CD
  # stopped doing this by default in 1.8).
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end
    return hs
