# ExternalSecrets anywhere read OpenBao's KV store `secret/` through this
# store, as external-secrets' service account (OpenBao's Kubernetes auth,
# role external-secrets, read-only; set up by up.sh).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets-operator
            namespace: external-secrets-operator
---
# The platform's own credentials (Atlantis's Gitea token, its OpenBao token)
# live in OpenBao's KV `platform/`, readable only through this store and only
# from the namespaces listed here (role external-secrets-platform).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-platform
spec:
  conditions:
    - namespaces:
        - atlantis
        - github-runner
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: platform
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-platform
          serviceAccountRef:
            name: external-secrets-operator
            namespace: external-secrets-operator
