apiVersion: apps/v1
kind: Deployment
metadata:
  name: metaphor
spec:
  replicas: 1
  selector:
    matchLabels: {app: metaphor}
  template:
    metadata:
      labels: {app: metaphor}
    spec:
      # Built by the lkdocker runner into the image store of the node that
      # runs litek8s's Docker engine: run there, never pull.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: Exists}
      containers:
        - name: metaphor
          image: metaphor
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
