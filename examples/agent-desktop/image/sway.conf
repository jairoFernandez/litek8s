# No bar, no wallpaper, no idle or lock: one output and the apps.
output HEADLESS-1 resolution @SIZE@
default_border pixel 2
focus_follows_mouse no
seat * hide_cursor 0
xwayland disable

set $mod Mod4
bindsym $mod+Return exec foot
bindsym $mod+b exec chromium-agent
bindsym $mod+Shift+q kill
bindsym $mod+f fullscreen toggle

exec wayvnc --output=HEADLESS-1 127.0.0.1 5900
exec chromium-agent
