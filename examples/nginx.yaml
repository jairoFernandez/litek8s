apiVersion: litek8s.dev/v1alpha1
kind: Deployment
metadata:
  name: demo-nginx
spec:
  replicas: 1
  template:
    spec:
      restartPolicy: Always
      containers:
        - name: nginx
          image: nginx:alpine
          command: ["nginx"]
          args: ["-g", "daemon off;"]
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
          ports:
            - containerPort: 80
              hostPort: 8089
