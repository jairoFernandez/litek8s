# Distributed feed-forward pipeline.
#
#   litek8s pipeline run -f examples/pipeline-demo.yaml --show-output
#
# The input activation flows through each layer's weight matmul in order. Within
# a layer the weight is sharded by COLUMNS across the cluster (weighted by each
# node's CPU cores), so every node holds only its slice of the weight — a model
# too large for one node is split across many. ReLU runs between layers so it
# behaves like a real network, not a single collapsed linear map.
#
# This 4x4 -> 4x5 -> 5x3 stack is hand-checkable; use `--layers N --dim D` to
# generate a large deterministic model that actually fills the nodes.
input:
  - [0.5, -0.2, 0.1, 0.4]
  - [0.3, 0.8, -0.6, 0.2]
layers:
  - in_dim: 4
    out_dim: 5
    seed: 101
    relu: true
  - in_dim: 5
    out_dim: 3
    seed: 202
    relu: false
