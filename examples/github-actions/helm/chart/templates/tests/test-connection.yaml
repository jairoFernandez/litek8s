# `helm test`: a pod that fetches the page through the Service's DNS name.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: [sh, -c, 'wget -qO- http://{{ .Release.Name }} | grep -q "{{ .Values.message }}"']
