services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30
  web:
    build: ./app
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
  # The integration test, run with `docker compose run --rm test`.
  test:
    image: busybox:1.36
    profiles: [test]
    depends_on:
      web: {condition: service_healthy}
    command: ["sh", "-c", "wget -qO- http://web:8000/ && wget -qO- http://web:8000/"]
