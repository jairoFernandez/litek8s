apiVersion: litek8s.dev/v1alpha1
kind: Cluster
metadata:
  name: demo-cross-cloud

spec:
  # The hub is the daemon you apply this on (typically the EC2 box with a
  # stable public IP). Spokes dial it on UDP 51820.
  vpn:
    cidr: 10.42.0.0/24
    hubEndpoint: 54.123.45.67:51820   # replace with your EIP
    hubRole: this

  # Worker nodes. `vpnIp` must already be registered on the hub (run
  # `litek8s vpn join --token <T> --ssh-hub <hub> --node-name <X>` on each
  # spoke before applying this manifest).
  nodes:
    - name: civo-1
      ssh: ubuntu@159.223.1.2          # spoke's public SSH for bootstrap
      vpnIp: 10.42.0.2                  # cluster ops will use this once known
      install: true                     # build + scp litek8s binary first
      labels:
        role: edge
        provider: civo

    - name: laptop
      ssh: jairo@cloudflared-tunnel
      vpnIp: 10.42.0.3
      labels:
        role: dev

  # Optional: workload manifests to apply after the cluster is healthy. Paths
  # are relative to the directory you run `litek8s cluster apply` from.
  workloads:
    - file: examples/nginx.yaml
