[package]
name = "litek8s"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
bollard = "0.18.1"
clap = { version = "4.5.32", features = ["derive"] }
directories = "5.0.1"
futures-util = "0.3.31"
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha2 = "0.10.8"
tokio = { version = "1.44.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.18.0"
