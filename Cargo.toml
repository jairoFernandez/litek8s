[package]
name = "litek8s"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
base64 = "0.22.1"
bollard = "0.18.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.32", features = ["derive"] }
directories = "5.0.1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
futures-util = "0.3.31"
half = "2.7.1"
hex = "0.4.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
memmap2 = { version = "0.9.10", optional = true }
openraft = { version = "=0.9.21", features = ["serde", "storage-v2"] }
prost-reflect = "0.16.5"
regex = "1"
ring = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rand_core = { version = "0.6", features = ["getrandom"] }
safetensors = { version = "0.7.0", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha1 = "0.10"
sha2 = "0.10.8"
socket2 = "0.6.4"
sysinfo = "0.33.1"
tar = "0.4.44"
terminal_size = "0.4"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"], optional = true }
tokio = { version = "1.44.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ruzstd = "0.9.1"

# The macOS dev VM (`litek8s dev up` on a Mac) uses Apple's
# Virtualization.framework.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-virtualization = "0.3"

[features]
default = ["llm"]
# The LLM/tensor-model stack: safetensors and GGUF loading, tokenizers
# (oniguruma), the transformer, KV cache and distributed LLM coordinator, and
# the `litek8s llm` / `litek8s model` commands. `--no-default-features` builds
# the orchestrator alone. Distributed matmul (`matrix`) stays: the daemon and
# node agent protocol carry it.
llm = ["dep:memmap2", "dep:safetensors", "dep:tokenizers"]

[dev-dependencies]
prost = "0.14"
tempfile = "3.18.0"

[profile.release]
opt-level = 3

[build-dependencies]
protox = "0.10.0"
# lto/codegen-units=1 give a few % more but make the per-node cross-compile
# install painfully slow to iterate on; opt-level 3 already autovectorizes.

[[test]]
name = "llm_qwen"
required-features = ["llm"]

[[test]]
name = "topk_attention"
required-features = ["llm"]

[[test]]
name = "transformer"
required-features = ["llm"]

[[test]]
name = "model_load"
required-features = ["llm"]
