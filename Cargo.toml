[package]
name = "litek8s"
version = "0.2.5"
edition = "2024"
description = "A lightweight Kubernetes in one binary: the real API, dev clusters, a Docker API, a terminal UI and built-in observability"
license = "Apache-2.0"
repository = "https://github.com/jairoFernandez/litek8s"
homepage = "https://litek8s.dev"
documentation = "https://litek8s.dev/docs/"
readme = "README.md"
keywords = ["kubernetes", "containers", "orchestration", "crun", "edge"]
categories = ["command-line-utilities", "virtualization"]
rust-version = "1.90"
# What the crate needs to build (the docs and skill are compiled in for
# `litek8s mcp` / `litek8s skill`) and its tests; benchmark and corpus
# results, scripts and images stay in the repository.
include = [
    "/src/**",
    "/build.rs",
    "/proto/**",
    "/openapi/**",
    "/tests/**",
    "/examples/**",
    "/skills/**",
    "/docs/*.md",
    "/compat/CONFORMANCE.md",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/THIRD-PARTY.md",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
]

[dependencies]
anyhow = "1.0.97"
base64 = "0.22.1"
bollard = "0.18.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.32", features = ["derive", "env"] }
# `litek8s completion <shell>`: shell completion scripts from the clap tree.
clap_complete = "4.5"
directories = "5.0.1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
futures-util = "0.3.31"
hex = "0.4.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
openraft = { version = "=0.9.21", features = ["serde", "storage-v2"] }
prost-reflect = "0.16.5"
regex = "1"
ring = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["raw_value"] }
serde_yaml = "0.9.34"
sha1 = "0.10"
sha2 = "0.10.8"
socket2 = "0.6.4"
sysinfo = "0.33.1"
tar = "0.4.44"
tokio = { version = "1.44.1", features = ["full"] }
# openraft logs through tracing; ha/mod.rs prints its warnings and errors.
tracing = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ruzstd = "0.9.1"
# `litek8s ui`: the terminal UI. crossterm is ratatui's (re-exported as
# ratatui::crossterm); `event-stream` lets the UI wait for keys without a
# thread of its own polling.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }

# The macOS dev VM (`litek8s dev up` on a Mac) uses Apple's
# Virtualization.framework.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-virtualization = "0.3"

[dev-dependencies]
prost = "0.14"
protox = "0.10.0"
tempfile = "3.18.0"

# lto/codegen-units=1 give a few % more for a much slower build; opt-level 3
# already autovectorizes.
[profile.release]
opt-level = 3

[build-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
protox = "0.10.0"
serde_json = "1.0.140"
