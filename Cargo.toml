[package]
name = "litek8s"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
base64 = "0.22.1"
bollard = "0.18.1"
clap = { version = "4.5.32", features = ["derive"] }
directories = "5.0.1"
futures-util = "0.3.31"
half = "2.7.1"
hex = "0.4.3"
memmap2 = "0.9.10"
openraft = { version = "=0.9.21", features = ["serde", "storage-v2"] }
rand_core = { version = "0.6", features = ["getrandom"] }
safetensors = "0.7.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha2 = "0.10.8"
socket2 = "0.6.4"
sysinfo = "0.33.1"
terminal_size = "0.4"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
tokio = { version = "1.44.1", features = ["full"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3.18.0"

[profile.release]
opt-level = 3
# lto/codegen-units=1 give a few % more but make the per-node cross-compile
# install painfully slow to iterate on; opt-level 3 already autovectorizes.
