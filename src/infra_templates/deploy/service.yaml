apiVersion: litek8s.dev/v1alpha1
kind: Service
metadata:
  name: {{PROJECT_NAME}}-svc
spec:
  # Back this Service with the Deployment defined in app.yaml.
  deploymentName: {{PROJECT_NAME}}
  # Bind a stable local listener on the control plane and forward to the
  # replica's container port. 127.0.0.1 keeps it off the public interface.
  listenAddr: 127.0.0.1:8080
  targetPort: 80
