apiVersion: litek8s.dev/v1alpha1
kind: Deployment
metadata:
  name: {{PROJECT_NAME}}
spec:
  replicas: 1
  template:
    spec:
      # Pin to the logical node registered with `litek8s node add node-0 ...`.
      nodeName: node-0
      restartPolicy: Always
      # Uncomment to bind-mount a host directory into the container. The path
      # must be absolute and already exist on the node (deploy.sh pre-creates
      # it). Reference it from the container via volumeMounts below.
      # volumes:
      #   - name: data
      #     hostPath: /opt/{{PROJECT_NAME}}/data
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
              hostPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 2
            timeoutSeconds: 2
          # volumeMounts:
          #   - name: data
          #     mountPath: /usr/share/nginx/html
          #     readOnly: true
